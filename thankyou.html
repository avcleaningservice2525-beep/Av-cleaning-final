<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Thank You | AV Cleaning</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f7fa;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

.box{
    background:white;
    padding:60px;
    border-radius:25px;
    text-align:center;
    max-width:600px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);

    position:relative;
}

.box::before{
    content:"";
    position:absolute;
    top:0;
    left:0;
    right:0;
    bottom:0;

    background:url('logo.jpg') center center no-repeat;
    background-size:400px;

    opacity:0.025;
}

.box h1,
.box p,
.box a{
    position:relative;
    z-index:1;
}

h1{
    color:#28a745;
    margin-bottom:20px;
}

p{
    font-size:20px;
    color:#555;
    line-height:1.6;
}

a{
    display:inline-block;
    margin-top:25px;
    background:#28a745;
    color:white;
    padding:15px 35px;
    border-radius:50px;
    text-decoration:none;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h1>Thank You For Contacting AV Cleaning!</h1>

    <p>
        Your request has been received successfully.
        Our team will contact you shortly to discuss your cleaning needs.
    </p>

    <a href="/">Back To Home</a>
</div>

</body>
</html>
